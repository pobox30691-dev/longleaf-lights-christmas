<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Longleaf Lights Christmas Countdown</title>
<style>
:root{--green:#174b37;--red:#ae283b;--gold:#c49b4c;--cream:#fff8eb}*{box-sizing:border-box}body{margin:0;font-family:system-ui,Arial,sans-serif;color:var(--green);background:transparent}.scene{position:relative;overflow:hidden;min-height:390px;padding:90px 15px 22px;text-align:center;background:linear-gradient(145deg,#fff9ed,#f4e9d3);border:3px solid var(--gold);border-radius:20px;box-shadow:inset 0 0 0 5px rgba(255,255,255,.6)}.lights{position:absolute;top:0;left:0;right:0;height:44px;display:flex;justify-content:space-around;align-items:flex-start;border-top:5px solid #235b40;z-index:3}.bulb{width:15px;height:24px;border-radius:45% 45% 50% 50%;background:#e74c3c;box-shadow:0 0 15px currentColor;animation:twinkle 1.8s infinite alternate}.bulb:nth-child(3n){background:#f5ca62;color:#f5ca62;animation-delay:.4s}.bulb:nth-child(3n + 1){background:#d73d4e;color:#d73d4e;animation-delay:.8s}.bulb:nth-child(3n + 2){background:#42a17a;color:#42a17a}.bulb:before{content:'';display:block;width:8px;height:6px;background:#315b43;margin:-5px auto 0;border-radius:2px}@keyframes twinkle{from{opacity:.55;filter:brightness(.7)}to{opacity:1;filter:brightness(1.3)}}h1{font-family:Georgia,serif;font-size:clamp(25px,6vw,40px);margin:8px 0 4px;color:var(--red)}.sub{font-weight:700;letter-spacing:.14em;text-transform:uppercase;font-size:12px}.date{font-weight:650;margin:10px 0 18px}.count{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;max-width:470px;margin:auto}.unit{padding:12px 4px;background:white;border:1px solid #e7cfa6;border-radius:12px;box-shadow:0 3px 9px #76521b14}.num{display:block;color:var(--red);font-weight:850;font-variant-numeric:tabular-nums;font-size:clamp(23px,6vw,38px)}.lbl{font-size:10px;letter-spacing:.1em;font-weight:700}.note{font-size:13px;margin:15px 0 0;color:#526c59}.garland{position:absolute;top:6px;left:0;right:0;height:55px;pointer-events:none;z-index:2;background:radial-gradient(ellipse 28px 17px at 4% 3%,#245d38 60%,transparent 64%),radial-gradient(ellipse 38px 22px at 15% 9%,#327447 60%,transparent 64%),radial-gradient(ellipse 38px 22px at 30% 5%,#245d38 60%,transparent 64%),radial-gradient(ellipse 40px 24px at 48% 6%,#327447 60%,transparent 64%),radial-gradient(ellipse 38px 22px at 67% 5%,#245d38 60%,transparent 64%),radial-gradient(ellipse 38px 22px at 83% 9%,#327447 60%,transparent 64%),radial-gradient(ellipse 28px 17px at 97% 3%,#245d38 60%,transparent 64%)}.ornament{position:absolute;top:26px;width:20px;height:20px;border-radius:50%;background:radial-gradient(circle at 30% 25%,#fff9,#bd2639 45%,#75182a);box-shadow:0 2px 6px #0003}.ornament:before{content:'';position:absolute;top:-6px;left:8px;height:7px;border-left:2px solid #c49b4c}.ornament.one{left:15%}.ornament.two{right:18%;background:radial-gradient(circle at 30% 25%,#fff9,#e8b84b 45%,#9b691a)}.ornament.three{left:48%;width:16px;height:16px;background:radial-gradient(circle at 30% 25%,#fff9,#c73546 45%,#75182a)}.sleigh-track{position:absolute;top:42px;left:0;width:100%;height:46px;overflow:hidden;pointer-events:none;z-index:2}.sleigh{position:absolute;left:-130px;width:115px;height:43px;animation:fly 32s linear infinite;filter:drop-shadow(0 1px 3px #6b263955)}@keyframes fly{0%,8%{transform:translateX(0) translateY(7px);opacity:0}10%{opacity:1}78%{opacity:1}88%,100%{transform:translateX(calc(100vw + 160px)) translateY(-7px);opacity:0}}.snow{position:absolute;inset:0;pointer-events:none;overflow:hidden}.flake{position:absolute;top:-20px;color:#9bc5c0;opacity:.5;animation:fall linear infinite}@keyframes fall{to{transform:translate3d(25px,400px,0)}}#welcome{display:none;font-family:Georgia,serif;font-size:clamp(20px,5vw,30px);color:var(--red);font-weight:bold;padding:20px 5px} @media(prefers-reduced-motion:reduce){.bulb,.flake,.sleigh{animation:none}.flake,.sleigh{display:none}}
</style></head><body><main class="scene"><div class="lights" aria-hidden="true"><i class="bulb"></i><i class="bulb"></i><i class="bulb"></i><i class="bulb"></i><i class="bulb"></i><i class="bulb"></i><i class="bulb"></i><i class="bulb"></i><i class="bulb"></i><i class="bulb"></i><i class="bulb"></i><i class="bulb"></i></div><div class="garland" aria-hidden="true"><span class="ornament one"></span><span class="ornament two"></span><span class="ornament three"></span></div><div class="sleigh-track" aria-hidden="true"><svg class="sleigh" viewBox="0 0 150 55" xmlns="http://www.w3.org/2000/svg"><g fill="none" stroke="#a72b3c" stroke-width="3" stroke-linecap="round"><path d="M5 35 Q15 15 25 34 M25 34 Q34 18 42 34 M43 34 L70 34"/><path d="M74 26 Q85 17 102 23 L119 29 L132 22"/><path d="M83 39 Q105 49 131 35"/><path d="M100 39 L108 45"/></g><path d="M73 27 L89 27 L92 37 L117 37 L126 29 L130 35 Q108 48 82 39 Z" fill="#bc2e42"/><circle cx="99" cy="20" r="7" fill="#f4d4a9"/><path d="M91 18 Q97 5 107 18 Z" fill="#c12d41"/><circle cx="106" cy="11" r="3" fill="white"/><path d="M96 27 Q108 19 113 33 L99 34 Z" fill="#d43a4e"/><path d="M76 24 Q81 12 90 25" fill="#d8aa4c"/></svg></div><div class="snow" aria-hidden="true" id="snow"></div><div class="sub">Longleaf Lights Presents</div><h1>Christmas 2026</h1><div id="before"><div class="date">Opening Friday, November 27 · 5:00 PM Central</div><div class="count" role="timer" aria-label="Time until Christmas show opening"><div class="unit"><span class="num" id="days">--</span><span class="lbl">DAYS</span></div><div class="unit"><span class="num" id="hours">--</span><span class="lbl">HOURS</span></div><div class="unit"><span class="num" id="minutes">--</span><span class="lbl">MINUTES</span></div><div class="unit"><span class="num" id="seconds">--</span><span class="lbl">SECONDS</span></div></div><p class="note">Get ready for a magical night of music and lights!</p></div><div id="welcome">🎄 Merry Christmas! The 2026 season has begun! 🎄</div></main>
<script>
(function(){const target=Date.parse('2026-11-27T17:00:00-06:00');const ids=['days','hours','minutes','seconds'];function tick(){const diff=Math.max(0,target-Date.now());if(diff===0){document.getElementById('before').style.display='none';document.getElementById('welcome').style.display='block';return}const values=[Math.floor(diff/86400000),Math.floor(diff/3600000)%24,Math.floor(diff/60000)%60,Math.floor(diff/1000)%60];ids.forEach((id,i)=>document.getElementById(id).textContent=String(values[i]).padStart(2,'0'))}tick();setInterval(tick,1000);const snow=document.getElementById('snow');for(let i=0;i<13;i++){const f=document.createElement('span');f.className='flake';f.textContent='❄';f.style.left=(i*37%100)+'%';f.style.fontSize=(12+i%4*5)+'px';f.style.animationDuration=(7+i%5*2)+'s';f.style.animationDelay=(-i*1.6)+'s';snow.appendChild(f)}})();
</script></body></html>
