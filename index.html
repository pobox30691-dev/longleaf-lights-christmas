<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Longleaf Lights Christmas Countdown</title>
<style>
:root{--green:#174b37;--red:#ae283b;--gold:#c49b4c;--cream:#fff8eb}*{box-sizing:border-box}body{margin:0;font-family:system-ui,Arial,sans-serif;color:var(--green);background:transparent}.scene{position:relative;overflow:hidden;min-height:345px;padding:46px 15px 22px;text-align:center;background:linear-gradient(145deg,#fff9ed,#f4e9d3);border:3px solid var(--gold);border-radius:20px;box-shadow:inset 0 0 0 5px rgba(255,255,255,.6)}.lights{position:absolute;top:0;left:0;right:0;height:44px;display:flex;justify-content:space-around;align-items:flex-start;border-top:5px solid #235b40}.bulb{width:15px;height:24px;border-radius:45% 45% 50% 50%;background:#e74c3c;box-shadow:0 0 15px currentColor;animation:twinkle 1.8s infinite alternate}.bulb:nth-child(3n){background:#f5ca62;color:#f5ca62;animation-delay:.4s}.bulb:nth-child(3n + 1){background:#d73d4e;color:#d73d4e;animation-delay:.8s}.bulb:nth-child(3n + 2){background:#42a17a;color:#42a17a}.bulb:before{content:'';display:block;width:8px;height:6px;background:#315b43;margin:-5px auto 0;border-radius:2px}@keyframes twinkle{from{opacity:.55;filter:brightness(.7)}to{opacity:1;filter:brightness(1.3)}}h1{font-family:Georgia,serif;font-size:clamp(25px,6vw,40px);margin:8px 0 4px;color:var(--red)}.sub{font-weight:700;letter-spacing:.14em;text-transform:uppercase;font-size:12px}.date{font-weight:650;margin:10px 0 18px}.count{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;max-width:470px;margin:auto}.unit{padding:12px 4px;background:white;border:1px solid #e7cfa6;border-radius:12px;box-shadow:0 3px 9px #76521b14}.num{display:block;color:var(--red);font-weight:850;font-variant-numeric:tabular-nums;font-size:clamp(23px,6vw,38px)}.lbl{font-size:10px;letter-spacing:.1em;font-weight:700}.note{font-size:13px;margin:15px 0 0;color:#526c59}.snow{position:absolute;inset:0;pointer-events:none;overflow:hidden}.flake{position:absolute;top:-20px;color:#9bc5c0;opacity:.5;animation:fall linear infinite}@keyframes fall{to{transform:translate3d(25px,400px,0)}}#welcome{display:none;font-family:Georgia,serif;font-size:clamp(20px,5vw,30px);color:var(--red);font-weight:bold;padding:20px 5px} @media(prefers-reduced-motion:reduce){.bulb,.flake{animation:none}.flake{display:none}}
</style></head><body><main class="scene"><div class="lights" aria-hidden="true"><i class="bulb"></i><i class="bulb"></i><i class="bulb"></i><i class="bulb"></i><i class="bulb"></i><i class="bulb"></i><i class="bulb"></i><i class="bulb"></i><i class="bulb"></i><i class="bulb"></i><i class="bulb"></i><i class="bulb"></i></div><div class="snow" aria-hidden="true" id="snow"></div><div class="sub">Longleaf Lights Presents</div><h1>Christmas 2026</h1><div id="before"><div class="date">Opening Friday, November 27 · 5:00 PM Central</div><div class="count" role="timer" aria-label="Time until Christmas show opening"><div class="unit"><span class="num" id="days">--</span><span class="lbl">DAYS</span></div><div class="unit"><span class="num" id="hours">--</span><span class="lbl">HOURS</span></div><div class="unit"><span class="num" id="minutes">--</span><span class="lbl">MINUTES</span></div><div class="unit"><span class="num" id="seconds">--</span><span class="lbl">SECONDS</span></div></div><p class="note">Get ready for a magical night of music and lights!</p></div><div id="welcome">🎄 Merry Christmas! The 2026 season has begun! 🎄</div></main>
<script>
(function(){const target=Date.parse('2026-11-27T17:00:00-06:00');const ids=['days','hours','minutes','seconds'];function tick(){const diff=Math.max(0,target-Date.now());if(diff===0){document.getElementById('before').style.display='none';document.getElementById('welcome').style.display='block';return}const values=[Math.floor(diff/86400000),Math.floor(diff/3600000)%24,Math.floor(diff/60000)%60,Math.floor(diff/1000)%60];ids.forEach((id,i)=>document.getElementById(id).textContent=String(values[i]).padStart(2,'0'))}tick();setInterval(tick,1000);const snow=document.getElementById('snow');for(let i=0;i<13;i++){const f=document.createElement('span');f.className='flake';f.textContent='❄';f.style.left=(i*37%100)+'%';f.style.fontSize=(12+i%4*5)+'px';f.style.animationDuration=(7+i%5*2)+'s';f.style.animationDelay=(-i*1.6)+'s';snow.appendChild(f)}})();
</script></body></html>
