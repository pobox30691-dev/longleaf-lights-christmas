<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Longleaf Lights — Christmas 2026</title>
<style>

:root{color-scheme:dark;--gold:#f2d48a;--cream:#fff6dc;--red:#b32230}
*{box-sizing:border-box}
html,body{margin:0;background:#05261d;font-family:Georgia,'Times New Roman',serif;color:var(--cream)}
.scene{position:relative;isolation:isolate;min-height:420px;overflow:hidden;border:3px solid #d9b66b;border-radius:19px;background:#06271d url("christmas-background.jpg") center center/100% 100% no-repeat;box-shadow:inset 0 0 0 3px #241409, inset 0 0 0 5px #eac778;text-align:center;padding:44px 15px 25px}
.scene:before{content:"";position:absolute;inset:6px;border:1px solid #a17b36;border-radius:12px;pointer-events:none}
.content{position:relative;z-index:2;max-width:720px;margin:auto;text-shadow:0 2px 9px #00150f,0 0 16px #00150f}
.eyebrow{font:700 clamp(13px,2.1vw,19px) Georgia,serif;letter-spacing:.15em;color:#f6dc98;text-transform:uppercase;margin:0 0 1px}
.presents{font:600 10px Arial,sans-serif;letter-spacing:.43em;color:#f9e9bb;margin:2px 0 0}
.heading{font:italic 700 clamp(38px,7.8vw,79px) Georgia,serif;line-height:1.08;color:#ffe5a2;margin:8px 0 15px;letter-spacing:-.045em;text-shadow:2px 3px 0 #8b1824,0 0 18px #9c311d,0 4px 12px #00190d}
.ribbon{display:inline-block;max-width:100%;padding:9px 23px;background:linear-gradient(180deg,#b32933,#6c0b19);border:1px solid #e2b55c;border-radius:7px;box-shadow:0 5px 15px #0009,inset 0 1px 0 #f6b3a080;color:#fff2d7;font-size:clamp(12px,2.5vw,18px);font-weight:bold}
.timer{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(5px,1.2vw,13px);max-width:570px;margin:18px auto 0}
.unit{min-width:0;padding:10px 2px 11px;background:linear-gradient(155deg,#073b2b,#031e19);border:2px solid #dcb566;border-radius:12px;box-shadow:inset 0 0 0 2px #493c1f,0 3px 12px #000a,0 0 12px #e3ac3a33}
.num{display:block;font:700 clamp(30px,6.7vw,61px) Georgia,serif;line-height:1.15;color:#ffe9ac;font-variant-numeric:tabular-nums;text-shadow:0 2px 3px #000}
.lbl{font:700 clamp(9px,1.5vw,13px) Arial,sans-serif;letter-spacing:.07em;color:#f9e8bc}
.note{margin:17px 0 0;font:italic clamp(13px,2.5vw,20px) Georgia,serif;color:#fff1d3}
.snow{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:1}
.flake{position:absolute;top:-20px;border-radius:50%;background:#fff;box-shadow:0 0 6px #fff8;opacity:.65;animation:fall linear infinite}
@keyframes fall{to{transform:translate3d(28px,480px,0)}}
.welcome{display:none;padding:25px 5px 20px;font-size:clamp(19px,4.2vw,34px);color:#ffedb8;font-weight:bold}
.welcome small{display:block;margin-top:15px;font-size:clamp(12px,2.5vw,18px);font-weight:normal}
.santa{position:absolute;z-index:2;top:25px;left:-310px;width:290px;height:90px;opacity:.92;animation:flight 32s linear infinite;filter:drop-shadow(0 0 4px #f2d58d88);pointer-events:none}
.santa .deer{animation:deerBob .85s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}
.santa .deer:nth-of-type(2){animation-delay:-.4s}
@keyframes deerBob{to{transform:translateY(-3px) rotate(-2deg)}}
@keyframes flight{0%,5%{transform:translateX(0) translateY(6px);opacity:0}9%{opacity:.92}84%{opacity:.92}98%,100%{transform:translateX(calc(100vw + 360px)) translateY(-10px);opacity:0}}
@media(max-width:520px){.scene{min-height:385px;padding:62px 10px 18px;background-size:auto 100%}
.heading{margin:12px 0 18px}
.timer{margin-top:18px}
.unit{padding:12px 1px}
.eyebrow{letter-spacing:.07em}
.note{line-height:1.4}
.santa{top:39px;width:210px;height:66px;left:-230px}}
@media(prefers-reduced-motion:reduce){.flake,.santa{display:none}}

</style>
</head>
<body>
<main class="scene">
<div class="snow" id="snow" aria-hidden="true">
</div>
<svg class="santa" aria-hidden="true" viewBox="0 0 380 110" xmlns="http://www.w3.org/2000/svg">
<!-- The sleigh and deer face right, matching the flight direction. -->
<g fill="#091810" stroke="#e8ca82" stroke-width=".65" stroke-linejoin="round">
  <!-- Santa's sleigh, runner and presents -->
  <path d="M18 63 Q35 76 102 70 L121 53 L121 77 Q104 90 46 86 Q27 82 18 63Z"/>
  <path d="M15 88 Q36 102 100 92 Q115 89 121 80" fill="none" stroke="#e8ca82" stroke-width="3" stroke-linecap="round"/>
  <path d="M26 88 L32 81 M92 91 L94 83" stroke-width="2"/>
  <rect x="29" y="40" width="24" height="23" rx="2" fill="#701b21"/>
  <path d="M41 40V63 M29 50H53" stroke="#d8ad55" stroke-width="2"/>
  <path d="M50 46 Q65 24 76 47 L86 67 L54 68Z" fill="#811d25"/>
  <circle cx="76" cy="33" r="10" fill="#f3d6b6" stroke="none"/>
  <path d="M66 30 Q65 14 80 16 L88 30Z" fill="#ad1d29"/>
  <circle cx="88" cy="30" r="3" fill="#fff2d4" stroke="none"/>
  <path d="M66 35 Q75 50 85 36 Q82 53 72 47Z" fill="#fff0dc" stroke="none"/>
  <path d="M82 53 L98 63" stroke="#fff0dc" stroke-width="5" stroke-linecap="round"/>
  <!-- Reins connecting Santa to the lead deer -->
  <path d="M97 61 Q175 34 259 53 M97 63 Q185 73 265 58" fill="none" stroke="#d5b77b" stroke-width="1.3"/>
</g>
<!-- Two recognizable galloping reindeer -->
<g class="deer" transform="translate(168 27)" fill="#091810" stroke="#d4b47a" stroke-width=".8" stroke-linejoin="round">
  <path d="M4 36 Q15 24 37 27 L52 32 L63 19 L69 21 L62 41 L49 44 L36 41 L19 43 L8 51Z"/>
  <path d="M59 19 L65 8 L69 15 L77 12 L75 23 L67 28Z"/>
  <path d="M66 10 L62 0 M66 10 L70 1 M67 13 L76 5 M65 12 L58 7" fill="none" stroke-width="2" stroke-linecap="round"/>
  <path d="M18 41 L2 64 L-3 62 L9 39 M39 41 L57 59 L53 64 L29 46" stroke-width="4" stroke-linecap="round"/>
  <path d="M8 32 L-3 25" fill="none" stroke-width="3"/>
</g>
<g class="deer" transform="translate(278 15) scale(.94)" fill="#091810" stroke="#d4b47a" stroke-width=".8" stroke-linejoin="round">
  <path d="M4 36 Q15 24 37 27 L52 32 L63 19 L69 21 L62 41 L49 44 L36 41 L19 43 L8 51Z"/>
  <path d="M59 19 L65 8 L69 15 L77 12 L75 23 L67 28Z"/>
  <path d="M66 10 L62 0 M66 10 L70 1 M67 13 L76 5 M65 12 L58 7" fill="none" stroke-width="2" stroke-linecap="round"/>
  <path d="M18 41 L2 64 L-3 62 L9 39 M39 41 L57 59 L53 64 L29 46" stroke-width="4" stroke-linecap="round"/>
  <path d="M8 32 L-3 25" fill="none" stroke-width="3"/>
</g>
<path d="M237 59 Q267 48 291 48" fill="none" stroke="#d5b77b" stroke-width="1.3"/>
</svg>
<div class="content">
<p class="eyebrow">Longleaf Lights</p>
<p class="presents">PRESENTS</p>
<h1 class="heading">Christmas 2026</h1>
<div id="before">
<div class="ribbon">Opening Friday, November 27 · 5:00 PM Central</div>
<div class="timer" role="timer" aria-label="Countdown to opening night">
<div class="unit">
<span class="num" id="days">--</span>
<span class="lbl">DAYS</span>
</div>
<div class="unit">
<span class="num" id="hours">--</span>
<span class="lbl">HOURS</span>
</div>
<div class="unit">
<span class="num" id="minutes">--</span>
<span class="lbl">MINUTES</span>
</div>
<div class="unit">
<span class="num" id="seconds">--</span>
<span class="lbl">SECONDS</span>
</div>
</div>
<p class="note">Get ready for a magical night of music and lights!</p>
</div>
<div class="welcome" id="welcome">Merry Christmas! The 2026 season has begun!<small>Enjoy the lights, and tune your radio to 107.9 FM.</small>
</div>
</div>
</main>
<script>(function(){const target=Date.parse('2026-11-27T17:00:00-06:00'),ids=['days','hours','minutes','seconds'];function tick(){let diff=Math.max(0,target-Date.now());if(diff===0){document.getElementById('before').style.display='none';document.getElementById('welcome').style.display='block';return}const values=[Math.floor(diff/86400000),Math.floor(diff/3600000)%24,Math.floor(diff/60000)%60,Math.floor(diff/1000)%60];ids.forEach((id,i)=>document.getElementById(id).textContent=String(values[i]).padStart(2,'0'))}tick();setInterval(tick,1000);
const snow=document.getElementById('snow');for(let i=0;i<22;i++){let f=document.createElement('i');f.className='flake';let size=2+i%4;f.style.cssText='left:'+(i*47%100)+'%;width:'+size+'px;height:'+size+'px;animation-duration:'+(9+i%8*2)+'s;animation-delay:'+(-i*1.8)+'s';snow.appendChild(f)}})();</script>
</body>
</html>
